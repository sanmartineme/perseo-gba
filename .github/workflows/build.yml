name: Compilar Perseo GBA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Instalar DevKit GBA
      run: |
        sudo apt-get update
        sudo apt-get install -y devkitpro-devkitarm devkitpro-libtonc

    - name: Configurar variables de entorno
      run: |
        export DEVKITPRO=/opt/devkitpro
        export DEVKITARM=$DEVKITPRO/devkitARM
        echo "DEVKITPRO=$DEVKITPRO" >> $GITHUB_ENV
        echo "DEVKITARM=$DEVKITARM" >> $GITHUB_ENV
        echo "$DEVKITARM/bin" >> $GITHUB_PATH

    - name: Limpiar build anterior
      run: make clean

    - name: Compilar Perseo GBA
      run: make -j4

    - name: Verificar ROM generada
      run: |
        ls -lh build/perseo.gba
        file build/perseo.gba

    - name: Subir artefacto ROM
      uses: actions/upload-artifact@v3
      with:
        name: perseo-gba
        path: build/perseo.gba
        retention-days: 30

    - name: Crear release si es tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/perseo.gba
