name: Compilar Perseo GBA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
    - uses: actions/checkout@v4

    - name: Verificar DevKit
      run: |
        echo "DEVKITPRO: $DEVKITPRO"
        echo "DEVKITARM: $DEVKITARM"
        which arm-none-eabi-gcc
        which grit

    - name: Limpiar build anterior
      run: make clean

    - name: Compilar Perseo GBA
      run: make -j4

    - name: Verificar ROM generada
      run: |
        ls -lh build/perseo.gba
        file build/perseo.gba

    - name: Subir artefacto ROM
      uses: actions/upload-artifact@v4
      with:
        name: perseo-gba
        path: build/perseo.gba
        retention-days: 30

    - name: Crear release si es tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/perseo.gba
