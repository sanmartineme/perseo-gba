name: Compilar Perseo GBA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
    - uses: actions/checkout@v4

    - name: Verificar ROM precompilada
      run: |
        echo "Verificando ROM compilada..."
        if [ -f "build/perseo.gba" ]; then
          echo "✅ ROM encontrada"
          ls -lh build/perseo.gba
        else
          echo "❌ ROM no encontrada"
          exit 1
        fi

    - name: Subir artefacto ROM
      uses: actions/upload-artifact@v4
      with:
        name: perseo-gba
        path: build/perseo.gba
        retention-days: 30

    - name: Crear release si es tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/perseo.gba
