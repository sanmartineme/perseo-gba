/* Cache de sprites por modo */
const cache={gba:{},gbc:{}};
function buildCache(){
  for(const m of ['gba','gbc']){
    const save=mode; mode=m;
    for(const k in SPR){
      const rows=SPR[k], h=rows.length;
      let w=0; for(const r of rows) w=Math.max(w,r.length);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d');
      for(let y=0;y<h;y++)for(let i=0;i<rows[y].length;i++){
        const ch=rows[y][i];
        if(ch!=='.'&&ch!==' '&&COL[ch]){x.fillStyle=C_(ch);x.fillRect(i,y,1,1);}
      }
      cache[m][k]=c;
    }
    mode=save;
  }
}
function spr(name,x,y,flip){
  // x,y ya deben venir en coordenadas de PANTALLA (mundo - cámara), redondeadas UNA sola vez
  // por el llamador. Redondear aquí de nuevo sobre una cámara ya redondeada causaba doble
  // redondeo y el característico "temblor" de sprites al desplazarse la cámara.
  const c=cache[mode][name]; if(!c)return;
  x=Math.round(x); y=Math.round(y);
  if(flip){ctx.save();ctx.translate(x+c.width,y);ctx.scale(-1,1);ctx.drawImage(c,0,0);ctx.restore();}
  else ctx.drawImage(c,x,y);
}
/* ---------- Audio: chiptune por ondas cuadradas (canales GB) ---------- */
let AC=null, muted=false, musicTimer=null, musicStep=0, curSong=null;
function audioInit(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function tone(freq,dur,type,vol,slide){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slide)o.frequency.linearRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.06,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}
function noise(dur,vol){
  if(!AC||muted)return;
  const n=AC.sampleRate*dur, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=b; g.gain.setValueAtTime(vol||0.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(g);g.connect(AC.destination);s.start();
}

function playSong(name){
  if(curSong===name)return; curSong=name;
  if(musicTimer)clearInterval(musicTimer); musicStep=0;
  if(!name)return;
  const s=SONGS[name];
  const wb=s.waveBass||'triangle', wl=s.waveLead||'square';
  const vb=s.volBass!=null?s.volBass:0.05, vl=s.volLead!=null?s.volLead:0.028;
  musicTimer=setInterval(()=>{
    if(muted||!AC)return;
    const i=musicStep%s.bass.length, j=musicStep%s.lead.length;
    if(s.bass[i]>0){
      tone(s.bass[i],0.16,wb,vb);
      if(s.echo)setTimeout(()=>{if(!muted&&AC)tone(s.bass[i]*0.995,0.14,wb,vb*0.4);},95);
    }
    if(s.lead[j]>0){
      tone(s.lead[j],0.1,wl,vl);
      if(s.echo)setTimeout(()=>{if(!muted&&AC)tone(s.lead[j]*0.995,0.09,wl,vl*0.35);},115);
    }
    if(s.drum){
      const k=musicStep%s.drum.length;
      if(s.drum[k])noise(0.045,0.035);
    }
    musicStep++;
  },60000/s.bpm/2);
}

/* ---------- Tiles ----------
 0 vacío | 1 ladrillo | 2 plataforma | 3 pinchos | 4 lodo | 5 rejilla(dash) | 6 chatarra | 8 pedestal
 | 9 riel electrificado (pulsa dañino/seguro, no sólido, como los pinchos) */
const SOLID=[1,5,6,8];
function isSolid(id){return SOLID.includes(id);}
function drawTile(id,px,py,thm,anim){
  switch(id){
    case 1:{
      // Ladrillo con mortero marcado y biselado: banda clara arriba y sombra abajo, para
      // darle el volumen y la lectura de "muro húmedo" del arte de referencia.
      ctx.fillStyle=C_(thm.brick);ctx.fillRect(px,py,8,8);
      const odd=((px/8+py/8)%2)!==0;
      ctx.fillStyle=C_(thm.brickD);
      ctx.fillRect(px,py+3,8,1);ctx.fillRect(px,py+7,8,1);
      ctx.fillRect(px+(odd?2:5),py,1,3);ctx.fillRect(px+(odd?6:1),py+4,1,3);
      ctx.globalAlpha=0.18;
      ctx.fillStyle=C_('G');
      ctx.fillRect(px,py,8,1);ctx.fillRect(px,py+4,8,1);
      ctx.globalAlpha=1;
      break;}
    case 2:
      // Plataforma metálica (rejilla), no madera: acorde al entorno industrial.
      ctx.fillStyle=C_('n');ctx.fillRect(px,py,8,3);
      ctx.fillStyle=C_('N');ctx.fillRect(px,py,8,1);
      ctx.fillStyle=C_('t');ctx.fillRect(px+2,py+1,1,2);ctx.fillRect(px+6,py+1,1,2);
      break;
    case 3:
      ctx.fillStyle=C_('L');
      ctx.beginPath();ctx.moveTo(px,py+8);ctx.lineTo(px+2,py+1);ctx.lineTo(px+4,py+8);ctx.fill();
      ctx.beginPath();ctx.moveTo(px+4,py+8);ctx.lineTo(px+6,py+1);ctx.lineTo(px+8,py+8);ctx.fill();
      break;
    case 4:{
      const off=Math.sin(anim/20+px/13)>0?1:0;
      ctx.fillStyle=C_('e');ctx.fillRect(px,py+off,8,8-off);
      ctx.fillStyle=C_('E');ctx.fillRect(px,py+off,8,2);
      if((px/8+Math.floor(anim/30))%4===0){ctx.fillStyle=C_('E');ctx.fillRect(px+3,py+3,2,2);}
      break;}
    case 5:
      ctx.fillStyle=C_('o');ctx.fillRect(px,py,8,8);
      ctx.fillStyle=C_('O');ctx.fillRect(px+1,py,2,8);ctx.fillRect(px+5,py,2,8);
      ctx.fillStyle=C_('K');ctx.fillRect(px+3,py,2,8);
      break;
    case 6:
      ctx.fillStyle=C_('n');ctx.fillRect(px,py,8,8);
      ctx.fillStyle=C_('N');ctx.fillRect(px+1,py+1,4,2);ctx.fillRect(px+4,py+5,3,2);
      ctx.fillStyle=C_('O');ctx.fillRect(px+6,py+2,2,2);ctx.fillStyle=C_('G');ctx.fillRect(px,py+5,3,1);
      break;
    case 8:
      ctx.fillStyle=C_('D');ctx.fillRect(px,py,8,8);
      ctx.fillStyle=C_('G');ctx.fillRect(px,py,8,2);ctx.fillRect(px+2,py+3,1,4);ctx.fillRect(px+5,py+3,1,4);
      break;
    case 9:{
      const hot=Math.floor(anim/40)%2===0;
      ctx.fillStyle=C_('K');ctx.fillRect(px,py+4,8,4);
      ctx.fillStyle=C_('G');ctx.fillRect(px,py+4,8,1);ctx.fillRect(px+1,py+6,1,2);ctx.fillRect(px+6,py+6,1,2);
      ctx.fillStyle=hot?C_('C'):C_('t');ctx.fillRect(px,py+5,8,1);
      if(hot){ctx.fillStyle=C_('W');ctx.fillRect(px+((Math.floor(anim/4)+Math.floor(px))%8),py+4,1,1);}
      break;}
  }
}

function newLevel(w,h,name,theme){
  const t=[]; for(let y=0;y<h;y++){t.push(new Array(w).fill(1));}
  return {w,h,t,name,theme,ents:[],spawn:[4,26]};
}
function carve(L,x0,y0,x1,y1,id){
  id=id||0;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)
    if(y>=0&&y<L.h&&x>=0&&x<L.w)L.t[y][x]=id;
}
function E(L,type,tx,ty,props){L.ents.push(Object.assign({type,x:tx*8,y:ty*8,alive:true},props||{}));}

function kd(...ks){return ks.some(k=>keys[k]);}
const IN={

/* ---------- Utilidades de mapa ---------- */
function tileAt(tx,ty){
  if(!LV)return 1;
  if(tx<0||tx>=LV.w||ty<0)return 1;
  if(ty>=LV.h)return 0;
  return LV.t[ty][tx];
}
function rectSolid(x,y,w,h){
  const x0=Math.floor(x/8),x1=Math.floor((x+w-1)/8),y0=Math.floor(y/8),y1=Math.floor((y+h-1)/8);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(isSolid(tileAt(tx,ty)))return true;
  return false;
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function burst(x,y,col,n,pow){
  for(let i=0;i<(n||8);i++)particles.push({x,y,vx:(Math.random()-0.5)*(pow||3),
    vy:(Math.random()-0.9)*(pow||3),t:20+Math.random()*15,col});
}

/* ---------- Carga de nivel ---------- */
function loadLevel(i){
  lvIndex=i; LV=LEVEL_BUILDERS[i]();
  for(const key of ensureSet(broken,i)){const [bx,by]=key.split(',').map(Number);LV.t[by][bx]=0;}
  LV.ents=LV.ents.filter(e=>{
    if(e.type==='chapa'&&ensureSet(collected,i).has(e.x+','+e.y))return false;
    if(e.type==='relic'&&ensureSet(collectedRelics,i).has(e.rid))return false;
    if(e.type==='shrine'&&P.ab[e.ab])return false;
    return true;
  });
  bossRef=LV.ents.find(e=>e.type==='boss')||null;
  if(bossRef)initBoss(bossRef);

/* ---------- Daño y muerte ---------- */
function damage(n,dir){
  if(P.inv>0||P.dashT>0)return;
  n=Math.max(1,Math.round(n*DIFF_CFG[difficulty].dmgTaken));
  if(P.relicsEq.bigotes)n=Math.max(1,n-1);
  P.hp-=n;P.inv=90;P.vx=(dir||1)*2;P.vy=-2.5;shake=6;SFX.hurt();P.regenT=0;
  burst(P.x+5,P.y+6,'R',6,2.5);
  if(P.hp<=0){state='dead';stateT=0;stats.deaths++;deathSel=0;playSong(null);}
}
function respawn(){
  P.hp=P.maxHp;P.inv=120;bossDialog=null;
  if(bossRef&&bossActive){initBoss(bossRef);bossRef.alive=true;openBossGate();bossActive=false;}
  const cp=checkpoint;
  if(cp&&cp.lv!==lvIndex){loadLevel(cp.lv);}
  else if(!cp){loadLevel(lvIndex);}
  else {projs=[];splats=[];playSong(LV.song);}
  if(cp)placePlayer(cp.tx,cp.ty); else placePlayer(LV.spawn[0],LV.spawn[1]);
  state='play';
}

/* ---------- Jugador ---------- */
function updatePlayer(){
  const SPD=1.35,ACC=0.3,GRV=0.22,JV=4.2,MAXF=4;
  const jp=IN.jump(),ap=IN.atk(),dp=IN.dash(),tp=IN.throw();
  const jPress=jp&&!jumpWas,aPress=ap&&!atkWas,dPress=dp&&!dashWas,tPress=tp&&!throwWas;
  jumpWas=jp;atkWas=ap;dashWas=dp;throwWas=tp;
  if(jPress)P.jbuf=7;else if(P.jbuf>0)P.jbuf--;
  if(P.inv>0)P.inv--; if(P.atkCd>0)P.atkCd--; if(P.dashCd>0)P.dashCd--;

  // Pata de la Suerte: regenera 1 corazón tras 12s (720 frames) sin recibir daño
  if(P.relicsEq.pata&&P.hp<P.maxHp&&P.inv===0){
    P.regenT++;
    if(P.regenT>720){P.hp++;P.regenT=0;SFX.pick();burst(P.x+5,P.y+2,'R',4,1.5);}
  }else if(P.inv>0)P.regenT=0;

  // Dash
  if(dPress&&P.ab.dash&&P.dashCd===0&&P.dashT===0){P.dashT=11;P.dashCd=32;P.vy=0;SFX.dash();}
  if(P.dashT>0){
    P.dashT--;P.vx=P.face*3.4;P.vy=0;
    burst(P.x+5-P.face*4,P.y+8,'B',1,1);
  }else{
    // Movimiento horizontal
    if(IN.left()){P.vx=Math.max(P.vx-ACC,-SPD);P.face=-1;}
    else if(IN.right()){P.vx=Math.min(P.vx+ACC,SPD);P.face=1;}
    else P.vx*=0.7;
    // Gravedad
    P.vy=Math.min(P.vy+GRV,MAXF);
  }

  // Muro (Garra Felina)
  P.wall=0;
  if(P.ab.climb&&!P.onG&&P.dashT===0){
    const dir=IN.left()?-1:IN.right()?1:0;
    if(dir!==0&&rectSolid(P.x+dir*2,P.y+2,P.w,P.h-4)){P.wall=dir;if(P.vy>0.8)P.vy=0.8;P.canD=true;}
  }

  // Saltos
  if(P.jbuf>0){
    if(P.onG||P.coyote>0){P.vy=-JV;P.onG=false;P.coyote=0;P.jbuf=0;P.spun=false;SFX.jump();}
    else if(P.wall!==0){P.vy=-4;P.vx=-P.wall*2.6;P.face=-P.wall;P.jbuf=0;P.spun=false;SFX.jump();burst(P.x+5,P.y+10,'G',4,2);}
    else if(P.ab.djump&&P.canD){P.vy=-3.8;P.canD=false;P.jbuf=0;P.spun=true;SFX.djump();burst(P.x+5,P.y+12,'C',5,2);}
  }
  if(!jp&&P.vy<-1.6&&P.dashT===0)P.vy=-1.6; // salto variable

  // Colisión horizontal
  const dashing=P.dashT>0;
  P.x+=P.vx;
  {
    const x0=Math.floor(P.x/8),x1=Math.floor((P.x+P.w-1)/8);
    const y0=Math.floor(P.y/8),y1=Math.floor((P.y+P.h-1)/8);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const id=tileAt(tx,ty);
      if(id===5&&dashing){LV.t[ty][tx]=0;broken[lvIndex].add(tx+','+ty);SFX.break();shake=4;burst(tx*8+4,ty*8+4,'O',6,3);continue;}
      if(isSolid(id)){
        if(P.vx>0)P.x=tx*8-P.w; else if(P.vx<0)P.x=tx*8+8;
        P.vx=0;
      }
    }
  }
  // Colisión vertical
  const prevFeet=P.y+P.h;
  P.y+=P.vy;
  P.onG=false;
  {
    const x0=Math.floor(P.x/8),x1=Math.floor((P.x+P.w-1)/8);
    if(P.vy>=0){
      // OJO: se usa (P.y+P.h)/8 — el borde exacto donde pisan los pies — y NO
      // (P.y+P.h-1)/8. Con el "-1" el aterrizaje se detectaba un píxel tarde: al
      // reposar justo encima del suelo, la MISMA fórmula dejaba de ver el tile sólido
      // apenas la gravedad sumaba una fracción de píxel, así que Perseo "caía" un
      // pixel, volvía a aterrizar, caía de nuevo... un parpadeo constante entre los
      // sprites de caminar/caer, muy notorio al moverse. Sin el "-1" el suelo se
      // detecta de forma estable en cada frame mientras el jugador está apoyado.
      const ty=Math.floor((P.y+P.h)/8);
      for(let tx=x0;tx<=x1;tx++){
        const id=tileAt(tx,ty);
        if(id===5&&dashing){LV.t[ty][tx]=0;broken[lvIndex].add(tx+','+ty);SFX.break();continue;}
        const plat=id===2&&prevFeet<=ty*8+1&&!IN.down();
        if(isSolid(id)||plat){P.y=ty*8-P.h;P.vy=0;P.onG=true;P.canD=true;P.coyote=7;P.spun=false;}
      }
    }else{
      const ty=Math.floor(P.y/8);
      for(let tx=x0;tx<=x1;tx++)if(isSolid(tileAt(tx,ty))){P.y=ty*8+8;P.vy=0;}
    }
  }
  if(!P.onG&&P.coyote>0)P.coyote--;

  // Animación de caminata: las patitas solo se mueven mientras el jugador sostiene
  // izquierda/derecha en el suelo. Se usa un contador PROPIO (P.walkAnim), no el reloj
  // global "frame", para que el ciclo arranque siempre en su fase 0 al empezar a caminar
  // — antes, al depender de "frame", el ciclo podía "aparecer" a mitad de camino y producir
  // un salto/temblor visual perceptible justo al iniciar el movimiento.
  P.walking = P.onG && P.dashT===0 && (IN.left()||IN.right());
  if(P.walking) P.walkAnim++; else P.walkAnim=0;

  // Tiles dañinos
  {
    const x0=Math.floor((P.x+1)/8),x1=Math.floor((P.x+P.w-2)/8);
    const y0=Math.floor((P.y+2)/8),y1=Math.floor((P.y+P.h-1)/8);
    let hz=0;
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      const id=tileAt(tx,ty);
      if(id===3||id===4)hz=id;
      if(id===9&&Math.floor(frame/40)%2===0)hz=9;
    }
    if(hz===3)damage(1,-P.face);
    if(hz===4){if(P.inv===0){damage(1,-P.face);P.vy=-3.2;}else P.vy=Math.min(P.vy,-1);}
    if(hz===9)damage(1,-P.face);
  }
  // Caída al vacío
  if(P.y>LV.h*8+40){damage(1,1);if(P.hp>0)respawnSoft();}

  // Habilidad pasiva 1 — Ataque: Ganchito mortal (cuerpo a cuerpo)
  if(aPress&&P.atkCd===0&&P.dashT===0){P.atkT=12;P.atkCd=18;P.swing++;SFX.atk();}
  if(P.atkT>0){
    P.atkT--;
    const hb={x:P.face>0?P.x+P.w-2:P.x-13,y:P.y-1,w:15,h:15};
    for(const e of LV.ents){
      if(!e.alive||e.hitSwing===P.swing)continue;
      const box=entBox(e);
      if(box&&overlap(hb,box)){hitEnemy(e);e.hitSwing=P.swing;}
    }
  }

  // Habilidad pasiva 2 — Lanzamiento de traza (proyectil a distancia).
  // Enfriamiento más largo que el ganchito: alcanza de lejos, así que no debe volver
  // trivial el combate cuerpo a cuerpo.
  if(P.throwCd>0)P.throwCd--;
  if(P.throwT>0)P.throwT--;
  if(tPress&&P.throwCd===0&&P.dashT===0){
    P.throwT=10;P.throwCd=34;
    projs.push({type:'traza',friendly:true,x:P.x+(P.face>0?P.w-2:-6),y:P.y+3,vx:P.face*3.4,t:0});
    SFX.traza();burst(P.x+(P.face>0?P.w:0),P.y+6,'o',4,2);
  }
}
function respawnSoft(){ if(checkpoint&&checkpoint.lv===lvIndex)placePlayer(checkpoint.tx,checkpoint.ty); else placePlayer(LV.spawn[0],LV.spawn[1]); }

/* ---------- Enemigos ---------- */
function entBox(e){
  switch(e.type){
    case 'rat':return {x:e.x,y:e.y,w:14,h:8};
    case 'roach':return {x:e.x,y:e.y,w:8,h:6};
    case 'mosq':return {x:e.x,y:e.y,w:8,h:8};
    case 'bat':return {x:e.x,y:e.y,w:8,h:8};
    case 'thug':return {x:e.x,y:e.y,w:16,h:10};
    case 'gunner':return {x:e.x,y:e.y,w:10,h:8};
    case 'brute':return {x:e.x,y:e.y,w:16,h:10};
    case 'boss':{const cfg=BOSS_CONFIG[e.key]||BOSS_CONFIG.capataz;return {x:e.x+1,y:e.y+2,w:cfg.w,h:cfg.h};}
    default:return null;
  }
}
function hitEnemy(e){
  const dmg=((e.type==='boss'&&e.state==='stun')?2:1)+(P.relicsEq.colmillo?1:0);
  e.hp-=dmg;e.flash=8;SFX.hitE();
  const box=entBox(e);burst(box.x+box.w/2,box.y+box.h/2,'W',5,2.5);
  if(e.type!=='boss'){e.vx=(e.x<P.x?-1:1)*1.5;}
  if(e.hp<=0){
    if(e.type==='boss'){e.state='die';e.t=0;}
    else{e.alive=false;burst(box.x+box.w/2,box.y+box.h/2,'R',10,3);
      if(Math.random()<0.25)LV.ents.push({type:'hp',x:e.x,y:e.y,alive:true});}
  }
}
function groundY(px,py){ // suelo bajo un punto
  let ty=Math.floor(py/8);
  while(ty<LV.h&&!isSolid(tileAt(Math.floor(px/8),ty)))ty++;
  return ty*8;
}
function updateEnts(){
  for(const e of LV.ents){
    if(!e.alive)continue;
    if(e.flash>0)e.flash--;
    switch(e.type){
      case 'rat':{
        if(e.dir===undefined){e.dir=-1;e.hp=2;e.vx=0;e.y=groundY(e.x+7,e.y)-8;}
        e.vx=e.vx?e.vx*0.8:0; if(Math.abs(e.vx)<0.1)e.vx=0;
        const spd=0.45,nx=e.x+(e.vx||e.dir*spd);
        const front=e.dir<0?nx:nx+14;
        if(isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+4)/8)))||
           !isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+9)/8))))e.dir*=-1;
        else e.x=nx;
        if(overlap(entBox(e),P))damage(1,P.x<e.x?-1:1);
        break;}
      case 'roach':{
        if(e.dir===undefined){e.dir=1;e.hp=1;e.y=groundY(e.x+4,e.y)-6;}
        const nx=e.x+e.dir*0.9,front=e.dir<0?nx:nx+8;
        if(isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+3)/8)))||
           !isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+7)/8))))e.dir*=-1;
        else e.x=nx;
        if(overlap(entBox(e),P))damage(1,P.x<e.x?-1:1);
        break;}
      case 'mosq':{
        if(e.hp===undefined){e.hp=1;e.ox=e.x;e.oy=e.y;e.st=0;e.t=0;}
        e.t++;
        if(e.st===0){
          e.x=e.ox+Math.sin(e.t/40)*12;e.y=e.oy+Math.sin(e.t/25)*4;
          const dx=P.x-e.x,dy=P.y-e.y;
          if(Math.abs(dx)<60&&Math.abs(dy)<50&&e.t>90){e.st=1;e.t=0;
            const d=Math.hypot(dx,dy)||1;e.vx=dx/d*1.7;e.vy=dy/d*1.7;}
        }else if(e.st===1){
          e.x+=e.vx;e.y+=e.vy;
          if(e.t>45||rectSolid(e.x,e.y,8,8)){e.st=2;e.t=0;}
        }else{
          e.x+=(e.ox-e.x)*0.05;e.y+=(e.oy-e.y)*0.05;
          if(e.t>60){e.st=0;e.t=0;}
        }
        if(overlap(entBox(e),P))damage(1,P.x<e.x?-1:1);
        break;}
      case 'bat':{
        if(e.hp===undefined){e.hp=2;e.dir=e.dir||1;e.ox=e.x;e.oy=e.y;e.t=0;}
        e.t++;
        e.x+=e.dir*0.6; e.y=e.oy+Math.sin(e.t/18)*3;
        if(Math.abs(e.x-e.ox)>28)e.dir*=-1;
        if(overlap(entBox(e),P))damage(1,P.x<e.x?-1:1);
        break;}
      case 'thug':{
        if(e.dir===undefined){e.dir=-1;e.hp=4;e.vx=0;e.y=groundY(e.x+8,e.y)-10;}
        e.vx=e.vx?e.vx*0.85:0; if(Math.abs(e.vx)<0.1)e.vx=0;
        const spd=0.35,nx=e.x+(e.vx||e.dir*spd);
        const front=e.dir<0?nx:nx+16;
        if(isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+4)/8)))||
           !isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+11)/8))))e.dir*=-1;
        else e.x=nx;
        if(overlap(entBox(e),P))damage(1,P.x<e.x?-1:1);
        break;}
      case 'gunner':{
        // Rata tiradora: patrulla como 'rat', pero además lanza proyectiles arqueados
        // hacia Perseo cuando lo tiene cerca en horizontal, para dañarlo a distancia.
        if(e.dir===undefined){e.dir=e.dir0||-1;e.hp=2;e.vx=0;e.y=groundY(e.x+5,e.y)-8;e.throwT=60+Math.floor(Math.random()*60);}
        e.vx=e.vx?e.vx*0.8:0; if(Math.abs(e.vx)<0.1)e.vx=0;
        const spd=0.35,nx=e.x+(e.vx||e.dir*spd);
        const front=e.dir<0?nx:nx+10;
        if(isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+4)/8)))||
           !isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+9)/8))))e.dir*=-1;
        else e.x=nx;
        const gdx=P.x-e.x;
        if(Math.abs(gdx)<100&&Math.abs(P.y-e.y)<40){
          e.dir=gdx<0?-1:1;
          if(e.throwT>0)e.throwT--;
          if(e.throwT<=0){
            e.throwT=100+Math.floor(Math.random()*50);
            projs.push({type:'junk',x:e.x+5,y:e.y+2,vx:(gdx<0?-1:1)*1.7,vy:-3.4,t:0});
            SFX.atk();
          }
        }
        if(overlap(entBox(e),P))damage(1,P.x<e.x?-1:1);
        break;}
      case 'brute':{
        // El Sicario: mucho más agresivo que el resto — patrulla como un matón, pero en
        // cuanto detecta a Perseo cerca y a su misma altura, embiste a toda velocidad en
        // línea recta hasta chocar contra un muro o contra el propio Perseo, y solo tras
        // un breve respiro vuelve a patrullar. Enemigo único: no se reutiliza en otros niveles.
        if(e.dir===undefined){e.dir=e.dir0||-1;e.hp=5;e.vx=0;e.mode='patrol';e.rt=0;e.y=groundY(e.x+8,e.y)-10;}
        const bdx=P.x-e.x;
        if(e.mode==='patrol'){
          e.vx=e.vx?e.vx*0.85:0; if(Math.abs(e.vx)<0.1)e.vx=0;
          const spd=0.3,nx=e.x+(e.vx||e.dir*spd);
          const front=e.dir<0?nx:nx+16;
          if(isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+4)/8)))||
             !isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+11)/8))))e.dir*=-1;
          else e.x=nx;
          if(Math.abs(bdx)<80&&Math.abs(P.y-e.y)<18){e.mode='charge';e.dir=bdx<0?-1:1;e.rt=0;SFX.hitE();shake=2;}
        }else if(e.mode==='charge'){
          e.rt++;
          const nx=e.x+e.dir*2.6;
          const front=e.dir<0?nx:nx+16;
          if(isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+4)/8)))||
             !isSolid(tileAt(Math.floor(front/8),Math.floor((e.y+11)/8)))||e.rt>50){
            e.mode='recover';e.rt=0;
          }else e.x=nx;
        }else{
          e.rt++;
          if(e.rt>40)e.mode='patrol';
        }
        if(overlap(entBox(e),P))damage(1,P.x<e.x?-1:1);
        break;}
      case 'boss':updateBoss(e);break;
      case 'chapa':{
        const box={x:e.x,y:e.y+Math.sin(frame/15+e.x)*2,w:8,h:8};
        if(overlap(box,P)){e.alive=false;collected[lvIndex].add(e.x+','+e.y);stats.chapas++;SFX.pick();burst(e.x+4,e.y+4,'Y',6,2);}
        break;}
      case 'hp':{
        if(overlap({x:e.x,y:e.y,w:8,h:7},P)){e.alive=false;P.hp=Math.min(P.maxHp,P.hp+1);SFX.pick();burst(e.x+4,e.y+3,'R',6,2);}
        break;}
      case 'relic':{
        const box={x:e.x,y:e.y+Math.sin(frame/13+e.x)*2,w:8,h:8};
        if(overlap(box,P)&&!P.relicsFound[e.rid]){
          e.alive=false;P.relicsFound[e.rid]=true;collectedRelics[lvIndex].add(e.rid);
          SFX.ability();burst(e.x+4,e.y+4,'M',12,2.5);shake=3;
          const R=RELICS.find(r=>r.id===e.rid);
          banner={title:'OBJETO: '+R.name,desc:R.desc,t:170};state='banner';
        }
        break;}
      case 'shrine':{
        if(overlap({x:e.x+3,y:e.y,w:10,h:16},P)&&!P.ab[e.ab]){
          P.ab[e.ab]=true;e.alive=false;SFX.ability();
          burst(e.x+8,e.y+4,'M',16,3.5);shake=4;
          banner={title:e.name,desc:e.desc,t:170};state='banner';
        }
        break;}
      case 'lamp':{
        if(!e.lit&&overlap({x:e.x,y:e.y,w:8,h:16},P)){
          e.lit=true;SFX.check();burst(e.x+4,e.y+2,'Y',8,2);
          checkpoint={lv:lvIndex,tx:Math.round(e.x/8),ty:Math.round(e.y/8)-1};
          for(const o of LV.ents)if(o!==e&&o.type==='lamp')o.lit=false;
        }
        break;}
      case 'sign':{
        if(Math.abs(P.x-e.x)<26&&Math.abs(P.y-e.y)<30)signText=e.text;
        break;}
      case 'door':{
        if(overlap({x:e.x,y:e.y,w:16,h:24},P)&&!trans){
          SFX.door();startTransition(e.to);
        }
        break;}
      case 'vdoor':{
        if(overlap({x:e.x,y:e.y,w:16,h:24},P)){
          state='ending';stateT=0;endIdx=0;endT=0;particles=[];playSong('end');
        }
        break;}
      case 'bossgate':{
        // OJO: la condición original solo comparaba P.x y un rango de P.y demasiado ancho
        // (P.y>e.y-40, cierto para casi media pantalla hacia abajo). Esa banda incluía el
        // propio punto de aparición del nivel (misma columna que la arena, pero en el
        // pasillo inferior) y el "bossgate" se disparaba ahí mismo, cerrando la puerta
        // ANTES de que el jugador recorriera el nivel — al llegar de verdad, el paso ya
        // estaba sellado ("el escenario cerrado"). Ahora se exige además estar dentro de
        // la franja vertical real de la arena/pasaje (por encima del pasillo inferior).
        if(!bossActive&&bossRef&&bossRef.alive&&P.x+P.w<e.x-4&&P.y>e.yband[0]&&P.y<e.yband[1]){
          bossActive=true;curGate=e;closeBossGate();
          bossRef.state='wait';bossRef.t=0; // el jefe espera quieto durante el diálogo
          // Gracia al entrar: en una arena pequeña Perseo puede quedar pegado al jefe justo
          // cuando la puerta se cierra; sin esta invulnerabilidad breve podía recibir un
          // golpe de contacto "invisible" en el mismo instante en que empieza la pelea y,
          // si llegaba ya herido, morir de inmediato — dando la sensación de que el jefe
          // "desaparecía" (la pantalla de muerte tapaba la pelea antes de que se viera nada).
          P.inv=Math.max(P.inv,90);
          bossDialog={lines:BOSS_DIALOG[bossRef.key]||BOSS_DIALOG.capataz,idx:0};
          state='bossdialog';shake=5;SFX.check();
        }
        break;}
    }
  }
  // Proyectiles
  for(const pr of projs){
    pr.t++;
    if(pr.friendly){
      // Traza de Perseo: vuela recto, muere contra muros y golpea al primer enemigo o jefe
      // que toque. Nunca comprueba colisión con el jugador (no puede dañarse a sí mismo).
      pr.x+=pr.vx;
      // Contra un muro se deshace sin más; contra un enemigo, revienta.
      if(rectSolid(pr.x+1,pr.y+1,6,4)||pr.t>85){pr.dead=true;burst(pr.x+4,pr.y+3,'o',5,2);continue;}
      for(const e of LV.ents){
        if(!e.alive)continue;
        const box=entBox(e);
        if(box&&overlap({x:pr.x,y:pr.y,w:8,h:6},box)){
          hitEnemy(e);pr.dead=true;
          // Explosión: salpicadura visible + lluvia de pedazos cafés + sacudida
          splats.push({x:pr.x-2,y:pr.y-2,t:16});
          burst(pr.x+4,pr.y+3,'O',10,3.2);
          burst(pr.x+4,pr.y+3,'o',8,2.6);
          shake=Math.max(shake,3);SFX.splat();
          break;
        }
      }
      continue;
    }
    if(pr.type==='junk'){pr.vy+=0.15;pr.x+=pr.vx;pr.y+=pr.vy;if(rectSolid(pr.x+1,pr.y+1,6,4)){pr.dead=true;burst(pr.x+3,pr.y+3,'N',4,2);}}
    else{pr.x+=pr.vx;if(rectSolid(pr.x,pr.y,8,5)||pr.t>140)pr.dead=true;
      const gy=groundY(pr.x+4,pr.y);pr.y=gy-6;}
    if(!pr.dead&&overlap({x:pr.x,y:pr.y,w:7,h:6},P)){pr.dead=true;damage(1,pr.vx>0?1:-1);}
  }
  projs=projs.filter(p=>!p.dead);
  for(const s of splats)s.t--;
  splats=splats.filter(s=>s.t>0);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.t--;}
  particles=particles.filter(p=>p.t>0);
}

/* ---------- Jefes (motor genérico reutilizado por los 6 encuentros) ---------- */
function initBoss(b){
  const cfg=BOSS_CONFIG[b.key]||BOSS_CONFIG.capataz;
  b.hp=cfg.hp;b.maxHp=cfg.hp;b.state='wait';b.t=0;b.face=1;b.vx=0;b.vy=0;b.flash=0;b.bounce=0;
  b.x=b.x0!==undefined?b.x0:b.x; b.y=groundY(b.x+15,b.y+2)-23;
  b.x0=b.x;b.y0=b.y;b.alive=true;
}
function closeBossGate(){if(curGate)carve(LV,curGate.gate[0],curGate.gate[1],curGate.gate[2],curGate.gate[3],1);}
function openBossGate(){if(curGate)carve(LV,curGate.passage[0],curGate.passage[1],curGate.passage[2],curGate.passage[3],0);}
function startBossIntro(){
  // Cierra el globo de diálogo cómic y arranca la entrada animada del jefe (rugido,
  // temblor creciente y polvo bajo sus patas) antes de que empiece a atacar de verdad.
  bossDialog=null;state='play';
  const cfg=bossRef?(BOSS_CONFIG[bossRef.key]||BOSS_CONFIG.capataz):BOSS_CONFIG.capataz;
  if(bossRef){bossRef.state='intro';bossRef.t=0;}
  SFX.boss();shake=8;playSong(cfg.song||'boss');
}
function updateBoss(b){
  if(!bossActive&&b.state!=='die')return;
  b.t++;
  const ph2=b.hp<=8, spd=ph2?1.3:1;
  const dx=P.x-(b.x+15);
  const face=dx<0?-1:1;
  switch(b.state){
    case 'intro':{
      // Entrada más fluida: rugido inicial + polvo bajo las patas + temblor que crece,
      // en vez de un único pulso de shake cada 12 frames sin más variación.
      if(b.t===1){SFX.boss();burst(b.x+15,b.y+22,'G',10,3);}
      if(b.t%10===0){shake=Math.min(9,3+b.t/9);burst(b.x+8+Math.random()*16,b.y+22,'n',3,1.5);}
      b.bounce=Math.sin(b.t*0.35)*Math.max(0,3-b.t/14);
      if(b.t>70){b.state='choose';b.t=0;b.bounce=0;}
      break;}
    case 'choose':{
      b.face=face;
      if(b.t>30){
        const cfg=BOSS_CONFIG[b.key]||BOSS_CONFIG.capataz;
        let pool=['charge','leap','throw'];
        // Betty, pasado el 40% de su vida, también puede llamar refuerzos: una fase extra
        // que la distingue como el enfrentamiento final, más allá de reciclar el mismo patrón.
        if(cfg.isFinal&&b.hp<=cfg.hp*0.4)pool=pool.concat(['summon','summon']);
        // "Explosión de basura": ataque exclusivo de Betty, una ráfaga radial de escombros
        // (a diferencia de 'throw', que lanza un solo proyectil por turno). Se elige al azar
        // igual que el resto de su repertorio.
        if(b.key==='betty')pool=pool.concat(['trashblast']);
        const opts=pool.filter(o=>o!==b.last);
        b.next=opts[Math.floor(Math.random()*opts.length)];b.last=b.next;
        b.state='tele';b.t=0;
      }
      break;}
    case 'tele':
      if(b.t>(ph2?18:26)){b.state=b.next;b.t=0;
        if(b.next==='charge'){b.vx=b.face*2.3*spd;}
        if(b.next==='leap'){b.vy=-5.2;b.vx=Math.max(-2.6,Math.min(2.6,dx/34))*spd;}
      }
      break;
    case 'charge':{
      const nx=b.x+b.vx,fx=b.vx<0?nx:nx+30;
      if(rectSolid(fx,b.y+4,1,16)){b.state='stun';b.t=0;shake=6;SFX.break();}
      else b.x=nx;
      break;}
    case 'stun': if(b.t>(ph2?45:65)){b.state='choose';b.t=0;} break;
    case 'leap':{
      b.vy+=0.22;b.x+=b.vx;b.y+=b.vy;
      if(b.vx<0&&rectSolid(b.x,b.y+4,1,16))b.vx=0;
      if(b.vx>0&&rectSolid(b.x+30,b.y+4,1,16))b.vx=0;
      if(b.vy>0&&rectSolid(b.x+2,b.y+23,26,1)){
        b.y=Math.floor((b.y+23)/8)*8-23;b.vy=0;shake=8;SFX.boss();
        projs.push({type:'shock',x:b.x-4,y:b.y+16,vx:-1.8,t:0});
        projs.push({type:'shock',x:b.x+30,y:b.y+16,vx:1.8,t:0});
        b.state='choose';b.t=0;
      }
      break;}
    case 'throw':{
      const n=ph2?4:3;
      if(b.t%20===1&&b.t<20*n+1){
        projs.push({type:'junk',x:b.x+12,y:b.y+4,vx:dx/55+(Math.random()-0.5),vy:-3.6-Math.random(),t:0});
        SFX.atk();
      }
      if(b.t>20*n+25){b.state='choose';b.t=0;}
      break;}
    case 'trashblast':{
      // Explosión de basura: en vez de un solo proyectil lanzado hacia Perseo, Betty hace
      // estallar un abanico de escombros a su alrededor de una sola vez.
      if(b.t===1){
        SFX.boss();shake=9;burst(b.x+15,b.y+10,'N',18,4);
        for(let i=-2;i<=2;i++){
          projs.push({type:'junk',x:b.x+15,y:b.y+6,vx:i*1.4,vy:-3.4-Math.random()*1.3,t:0});
        }
      }
      if(b.t>50){b.state='choose';b.t=0;}
      break;}
    case 'summon':{
      if(b.t===1){
        LV.ents.push({type:'rat',x:b.x-24,y:b.y+8,alive:true});
        LV.ents.push({type:'rat',x:b.x+34,y:b.y+8,alive:true});
        SFX.ability();shake=5;burst(b.x+15,b.y+10,'M',12,3);
      }
      if(b.t>40){b.state='choose';b.t=0;}
      break;}
    case 'die':{
      if(b.t===1){playSong(null);SFX.boss();}
      if(b.t%6===0)burst(b.x+Math.random()*30,b.y+Math.random()*22,['O','R','Y','G'][Math.floor(Math.random()*4)],5,3);
      if(b.t%10===0)shake=5;
      if(b.t>110){
        const cfg=BOSS_CONFIG[b.key]||BOSS_CONFIG.capataz;
        b.alive=false;bossActive=false;openBossGate();
        LV.ents.push({type:'hp',x:b.x+4,y:b.y+14,alive:true});
        LV.ents.push({type:'hp',x:b.x+20,y:b.y+14,alive:true});
        const [ex,ey]=b.exit||[Math.round(b.x0/8),Math.round(b.y0/8)+1];
        if(cfg.isFinal){
          // El jefe final no abre paso a "otro nivel": abre la puerta del desenlace real.
          LV.ents.push({type:'vdoor',x:ex*8,y:ey*8,alive:true});
        }else{
          LV.ents.push({type:'door',x:ex*8,y:ey*8,alive:true,to:cfg.nextLevel});
          playSong(LV.song);
        }
        banner={title:cfg.victoryTitle,desc:cfg.victoryDesc,t:170};
        state='banner';
      }
      return;}
  }
  // El contacto solo hace daño una vez que el jefe está realmente combatiendo: durante
  // 'wait' (dormido) e 'intro' (entrada cinemática) Perseo puede acercarse sin castigo.
  if(b.state!=='die'&&b.state!=='wait'&&b.state!=='intro'&&overlap(entBox(b),P))damage(1,P.x<b.x+15?-1:1);
}

/* ---------- Transición mosaico ---------- */
function startTransition(toLv){
  snapC.width=cv.width;snapC.height=cv.height;
  snapC.getContext('2d').drawImage(cv,0,0);
  trans={phase:'out',t:0,to:toLv};state='trans';
}
function updateTransition(){
  trans.t++;
  if(trans.phase==='out'&&trans.t>26){
    loadLevel(trans.to);placePlayer(LV.spawn[0],LV.spawn[1]);
    trans.phase='in';trans.t=0;
  } else if(trans.phase==='in'&&trans.t>26){
    trans=null;
    if(!storyShown[lvIndex]){
      storyShown[lvIndex]=true;storyPages=LV.story;storyIdx=0;storyPanT=0;particles=[];state='levelstory';
    }else state='play';
  }
}
/* ---------- Render ---------- */
function pixelate(size){
  if(size<=1)return;
  tmpC.width=Math.max(1,Math.ceil(cv.width/size));
  tmpC.height=Math.max(1,Math.ceil(cv.height/size));
  const t=tmpC.getContext('2d');
  t.imageSmoothingEnabled=false;
  t.clearRect(0,0,tmpC.width,tmpC.height);
  t.drawImage(cv,0,0,tmpC.width,tmpC.height);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(tmpC,0,0,tmpC.width,tmpC.height,0,0,cv.width,cv.height);
}
function text(s,x,y,col,size,center){
  ctx.fillStyle=C_(col||'W');ctx.font=(size||7)+'px monospace';
  ctx.textBaseline='top';ctx.textAlign=center?'center':'left';
  ctx.fillText(s,x,y);ctx.textAlign='left';
}
function wrapText(s,maxw,size){
  ctx.font=(size||7)+'px monospace';
  const words=s.split(' '),lines=[];let cur='';
  for(const w of words){
    const t2=cur?cur+' '+w:w;
    if(ctx.measureText(t2).width>maxw&&cur){lines.push(cur);cur=w;}else cur=t2;
  }
  if(cur)lines.push(cur);return lines;
}
/* Tubería horizontal con bridas, al estilo del arte de referencia: cuerpo con sombreado en
   tres bandas (oscuro arriba, medio, brillo superior) y anillos de unión cada cierto tramo. */
function pipeH(x,y,w,th,off){
  ctx.fillStyle=C_('t');ctx.fillRect(x,y,w,th);
  ctx.fillStyle=C_('T');ctx.fillRect(x,y+1,w,Math.max(1,th-3));
  ctx.fillStyle=C_('G');ctx.fillRect(x,y+1,w,1);                 // brillo especular
  ctx.fillStyle=C_('t');
  for(let fx=x-((off%34)+34)%34;fx<x+w;fx+=34){
    const px=Math.max(x,Math.min(x+w-3,fx));
    ctx.fillRect(px,y-1,3,th+2);                                  // brida
  }
}
/* Bajante vertical con la misma lógica de sombreado. */
function pipeV(x,y,h,th){
  ctx.fillStyle=C_('t');ctx.fillRect(x,y,th,h);
  ctx.fillStyle=C_('T');ctx.fillRect(x+1,y,Math.max(1,th-3),h);
  ctx.fillStyle=C_('G');ctx.fillRect(x+1,y,1,h);
}
function drawParallax(SW,SH){
  const gba=mode==='gba';
  // Muro de fondo: ladrillo oscuro con mortero, en vez de un color plano.
  ctx.fillStyle=C_('S');ctx.fillRect(0,0,SW,SH);
  const wo=Math.floor(cam.x*0.2);
  ctx.fillStyle=C_('s');
  for(let ry=0;ry<SH;ry+=10){
    const stagger=((ry/10)|0)%2?11:0;
    for(let rx=-22;rx<SW+22;rx+=22){
      const bx=rx-((wo%22)+22)%22+stagger;
      ctx.fillRect(bx,ry,20,8);
    }
  }
  // Capa lejana: siluetas del metro/ciudad tras el muro (solo GBA: capa extra de profundidad)
  if(gba){
    ctx.fillStyle=C_('K');
    const o1=Math.floor(cam.x*0.3);
    for(let i=-1;i<SW/34+2;i++){
      const wx=i*34-((o1%34)+34)%34;
      const h=26+((i*37+(o1/34|0))*13%20+20)%20;
      ctx.fillRect(wx,SH-h-30,20,h+30);
      ctx.fillRect(wx+6,SH-h-38,8,10);
    }
  }
  // Capa media: entramado de tuberías industriales (el rasgo dominante de la referencia)
  const o2=Math.floor(cam.x*0.55);
  pipeH(0,18,SW,7,o2);
  pipeH(0,SH-46,SW,5,o2+17);
  for(let i=-1;i<SW/78+2;i++){
    const wx=i*78-((o2%78)+78)%78;
    pipeV(wx,25,SH-71,6);
    // Volante de válvula sobre algunos bajantes
    if((i+Math.floor(o2/78))%3===0){
      const vy=54;
      ctx.fillStyle=C_('t');ctx.fillRect(wx-4,vy,14,3);
      ctx.fillStyle=C_('G');ctx.fillRect(wx-2,vy+1,10,1);
      ctx.fillStyle=C_('t');ctx.fillRect(wx+2,vy-4,2,5);
    }
  }
  if(!gba)return; // el goteo cian queda solo para GBA, por presupuesto de color
  // Goteo de agua: destellos cian cayendo desde las juntas, con cadencia desfasada
  const dripX=[26,104,182,238];
  for(let i=0;i<dripX.length;i++){
    const dx=dripX[i]-((Math.floor(cam.x*0.55)%SW)+SW)%SW;
    const ph=(frame+i*37)%110;
    if(ph<60){
      const dy=25+ph*1.5;
      ctx.fillStyle=C_('C');
      ctx.globalAlpha=0.75;
      ctx.fillRect(Math.round(dx)+2,Math.round(dy),1,3);
      ctx.globalAlpha=1;
    }
  }
}
function drawEnt(e,camX,camY){
  const ex=e.x-camX, ey=e.y-camY;
  switch(e.type){
    // Enemigos terrestres: ciclo de caminata de 2 fases (patrullan sin parar, así que
    // el ciclo corre continuo con el reloj de frames, igual que el aleteo de los murciélagos).
    case 'rat':spr(frame%20<10?'rat1':'rat2',ex-1,ey,e.dir>0);break;
    case 'roach':spr(frame%16<8?'roach1':'roach2',ex,ey,e.dir>0);break;
    case 'mosq':spr(frame%14<7?'mosq1':'mosq2',ex,ey);break;
    case 'boss':{
      if(e.flash>0&&(frame&1))break;
      const cfg=BOSS_CONFIG[e.key]||BOSS_CONFIG.capataz;
      // El jefe solo "camina" de verdad durante su embestida (estado 'charge'); el resto
      // del tiempo usa la pose base, para no animar patas mientras está quieto o en el aire.
      const name=(e.state==='charge'&&frame%12<6)?cfg.sprite+'_2':cfg.sprite;
      spr(name,ex-1,ey-(e.bounce||0),e.face>0);
      break;}
    case 'bat':spr(frame%16<8?'bat1':'bat2',ex,ey);break;
    case 'thug':spr(frame%22<11?'thug1':'thug2',ex-2,ey,e.dir>0);break;
    case 'gunner':spr(frame%18<9?'gunner1':'gunner2',ex-1,ey,e.dir>0);break;
    case 'brute':{
      // Zancada frenética mientras embiste; paso normal el resto del tiempo.
      const fast=e.mode==='charge';
      const name=(fast?frame%8<4:frame%22<11)?'brute1':'brute2';
      spr(name,ex-2,ey,e.dir>0);
      break;}
    case 'shrine':{
      spr('shrine',ex,ey+2);
      const oy=Math.sin(frame/20)*2;
      ctx.fillStyle=C_('M');ctx.fillRect(Math.round(ex+6),Math.round(ey-2+oy),4,4);
      ctx.fillStyle=C_('W');ctx.fillRect(Math.round(ex+7),Math.round(ey-1+oy),2,2);
      break;}
    case 'door':case 'vdoor':spr('door',ex,ey);break;
    case 'lamp':spr(e.lit?'lamp_on':'lamp_off',ex,ey);break;
    case 'chapa':spr('chapa',ex,ey+Math.sin(frame/15+e.x)*2);break;
    case 'relic':spr(e.icon,ex,ey+Math.sin(frame/13+e.x)*2);break;
    case 'hp':spr('heart',ex,ey+Math.sin(frame/12)*1.5);break;
    case 'sign':
      ctx.fillStyle=C_('n');ctx.fillRect(Math.round(ex+3),Math.round(ey+8),2,8);
      ctx.fillStyle=C_('N');ctx.fillRect(Math.round(ex),Math.round(ey+2),8,7);
      ctx.fillStyle=C_('Y');ctx.fillRect(Math.round(ex+3),Math.round(ey+4),2,3);
      break;
  }
}
const WALK_CYCLE=['p_walk1','p_walk2','p_walk3','p_walk4'];
function drawPlayer(camX,camY){
  if(P.inv>0&&(frame>>2)%2)return;
  let s, bob=0;
  if(P.dashT>0||P.spun)s='p_dash';
  else if(P.atkT>0){
    // El zarpazo dura 12 frames: preparación (12..9), impacto (8..5) y recobro (4..0),
    // para que se vea la patita delantera lanzarse y volver en lugar de una pose fija.
    s=P.atkT>8?'p_atk1':(P.atkT>4?'p_atk2':'p_atk3');
  }
  else if(!P.onG)s=P.vy<0?'p_jump':'p_fall';
  else if(P.walking){
    // Patas rápidas (ciclo de 4 fases cada 4 frames) + contoneo: en las fases de contacto
    // (2 y 4) el cuerpo "se hunde" 1px, dando el vaivén de peso que pide el estilo gráfico.
    // P.walkAnim es un contador propio que solo avanza mientras hay input de movimiento
    // real (ver updatePlayer), así el ciclo siempre arranca limpio en su fase 0 — antes
    // dependía del reloj global "frame" y podía "aparecer" a mitad de ciclo, dando un
    // pequeño salto/temblor visual justo al empezar a moverse.
    const wf=Math.floor(P.walkAnim/4)%4;
    s=WALK_CYCLE[wf];
    bob=(wf===1||wf===3)?1:0;
  }
  else s=(frame>>5)%2?'p_idle1':'p_idle2';
  const px=P.x-camX, py=P.y-camY+bob;
  spr(s,px-3,py-3,P.face<0);
  // El rastro de garras acompaña solo a la fase de impacto, abriéndose en dos tiempos
  if(P.atkT>4&&P.atkT<11){
    const sl=P.atkT>7?'slash':'slash2';
    spr(sl,P.face>0?px+P.w+1:px-9,py+1,P.face<0);
  }
}
function drawWorld(){
  const SW=cv.width,SH=cv.height;
  drawParallax(SW,SH);
  ctx.save();
  // NOTA: la cámara se resta ANTES de redondear, una sola vez por objeto (en spr()/fillRect),
  // en vez de trasladar el canvas con una cámara pre-redondeada y volver a redondear cada
  // sprite encima. Ese doble redondeo era la causa del temblor visual al desplazarse.
  const camX=cam.x, camY=cam.y;
  const sx=shake>0.5?(Math.random()-0.5)*shake:0,sy=shake>0.5?(Math.random()-0.5)*shake:0;
  ctx.translate(Math.round(sx),Math.round(sy));
  const x0=Math.floor(camX/8)-1,x1=x0+SW/8+2,y0=Math.floor(camY/8)-1,y1=y0+SH/8+2;
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const id=tileAt(tx,ty);
    if(id)drawTile(id,Math.round(tx*8-camX),Math.round(ty*8-camY),LV.theme,frame);
  }
  for(const e of LV.ents)if(e.alive)drawEnt(e,camX,camY);
  for(const pr of projs){
    if(pr.type==='traza'){
      // El mojón gira sobre sí mismo y se dibuja espejado según la dirección de vuelo
      spr((frame>>2)%2?'traza':'traza2',pr.x-camX,pr.y-camY,pr.vx<0);
      continue;
    }
    spr(pr.type==='junk'?'junkproj':'shock',pr.x-camX,pr.y-camY-(pr.type==='shock'?1:0));
  }
  // Salpicaduras de los impactos, parpadeando mientras se desvanecen
  for(const s of splats){
    if(s.t<6&&(frame&1))continue;
    spr('splat',s.x-camX,s.y-camY);
  }
  drawPlayer(camX,camY);
  for(const p of particles){ctx.fillStyle=C_(p.col);ctx.fillRect(Math.round(p.x-camX),Math.round(p.y-camY),2,2);}
  ctx.restore();
  drawHUD(SW,SH);
}
function drawHUD(SW,SH){
  // Barra de vida segmentada con marco oscuro y corazón como icono (estilo de la referencia),
  // en vez de una fila suelta de corazones.
  spr('heart',3,3);
  const bx=13,by=4,seg=7,segH=7;
  ctx.fillStyle=C_('K');ctx.fillRect(bx-1,by-1,P.maxHp*seg+2,segH+2);
  for(let i=0;i<P.maxHp;i++){
    const x=bx+i*seg;
    ctx.fillStyle=C_('D');ctx.fillRect(x,by,seg-1,segH);
    if(i<P.hp){
      ctx.fillStyle=C_('r');ctx.fillRect(x,by,seg-1,segH);
      ctx.fillStyle=C_('R');ctx.fillRect(x,by,seg-1,segH-2);
      ctx.fillStyle=C_('P');ctx.fillRect(x,by,seg-1,1);
    }
  }
  spr('chapa',4,14);text('x'+stats.chapas,14,15,'Y',7);
  const abs=[['djump','S2','C'],['dash','DSH','B'],['climb','GRR','M']];
  let ax=SW-4;
  for(const [k,lbl,col] of abs)if(P.ab[k]){
    ax-=20;ctx.fillStyle=C_('D');ctx.fillRect(ax,4,18,9);

  }
  let rx=SW-4;
  for(const r of RELICS)if(P.relicsEq[r.id]){rx-=10;spr(r.icon,rx,15);}
  if(bossActive&&bossRef&&bossRef.alive&&bossRef.state!=='wait'){
    const bcfg=BOSS_CONFIG[bossRef.key]||BOSS_CONFIG.capataz;
    ctx.fillStyle=C_('K');ctx.fillRect(SW/2-52,SH-14,104,10);
    ctx.fillStyle=C_('D');ctx.fillRect(SW/2-50,SH-12,100,6);
    ctx.fillStyle=C_('R');ctx.fillRect(SW/2-50,SH-12,100*Math.max(0,bossRef.hp)/bossRef.maxHp,6);
    text(bcfg.name,SW/2,SH-23,'W',7,true);
  }
  if(zoneT>0&&state==='play'){
    const a=Math.min(1,zoneT/30);
    ctx.globalAlpha=a;
    ctx.fillStyle=C_('K');ctx.fillRect(0,26,SW,14);
    text('— '+LV.name+' —',SW/2,29,'C',8,true);
    ctx.globalAlpha=1;
  }
  if(signText&&state==='play'){
    const lines=wrapText(signText,SW-24,7);
    const h=lines.length*9+8;
    ctx.fillStyle='rgba(10,12,20,0.88)';ctx.fillRect(6,SH-h-4,SW-12,h);
    ctx.strokeStyle=C_('T');ctx.strokeRect(6.5,SH-h-3.5,SW-13,h-1);
    lines.forEach((l,i)=>text(l,12,SH-h+i*9,'W',7));
  }
}
/* Dibuja un sprite existente como silueta plana de un solo color, conservando el pixelado
   (se recorre la definición ASCII en vez de tintar el canvas cacheado). */
function silhouette(rows,x,y,scale,col,flip){
  if(!rows)return;
  ctx.fillStyle=C_(col);
  const w=rows.reduce((m,r)=>Math.max(m,r.length),0);
  for(let ry=0;ry<rows.length;ry++){
    const row=rows[ry];
    for(let rx=0;rx<row.length;rx++){
      const ch=row[rx];
      if(ch==='.'||ch===' ')continue;
      const ox=flip?(w-1-rx):rx;
      ctx.fillRect(Math.round(x+ox*scale),Math.round(y+ry*scale),Math.ceil(scale),Math.ceil(scale));
    }
  }
}
/* Emblema de escudo del arte promocional: chapa metálica remachada con el skyline de la
   ciudad al fondo, siluetas de ratas acechando y Perseo recortado en negro con su pañuelo. */
function drawShield(cx,cy,w,h){
  const l=cx-w/2, r=cx+w/2, t=cy-h/2, b=cy+h/2;
  const shape=(inset)=>{
    ctx.beginPath();
    ctx.moveTo(l+inset,t+inset);
    ctx.lineTo(r-inset,t+inset);
    ctx.lineTo(r-inset,b-h*0.34);
    ctx.quadraticCurveTo(r-inset,b-inset,cx,b-inset);
    ctx.quadraticCurveTo(l+inset,b-inset,l+inset,b-h*0.34);
    ctx.closePath();
  };
  ctx.fillStyle=C_('G');shape(0);ctx.fill();           // borde metálico
  ctx.fillStyle=C_('t');shape(2);ctx.fill();
  ctx.fillStyle=C_('L');shape(4);ctx.fill();           // campo claro del escudo
  // Remaches del borde
  ctx.fillStyle=C_('T');
  [[l+4,t+4],[r-6,t+4],[l+4,b-h*0.42],[r-6,b-h*0.42],[cx-1,b-7]].forEach(p=>ctx.fillRect(Math.round(p[0]),Math.round(p[1]),2,2));
  ctx.save();
  shape(5);ctx.clip();
  // Skyline: silueta baja y tenue (no debe leerse como barrotes), pegada al borde inferior
  ctx.fillStyle=C_('G');
  const base=b-h*0.16;
  for(let i=0;i<12;i++){
    const bw=w/11, bx=l+i*bw, bh=5+((i*53)%11);
    ctx.fillRect(Math.round(bx),Math.round(base-bh),Math.ceil(bw),Math.round(bh+h));
  }
  // Ratas acechando detrás: siluetas oscuras derivadas del propio sprite de rata, para que
  // contrasten contra el campo claro del escudo en vez de perderse entre los edificios.
  silhouette(SPR.rat1,l+3,t+h*0.30,1.3,'t',false);
  silhouette(SPR.rat1,r-24,t+h*0.30,1.3,'t',true);
  // Perseo, grande y en primer plano
  const pImg=cache[mode]['p_idle1'];
  if(pImg){const s=Math.round(h*0.62);ctx.drawImage(pImg,Math.round(cx-s/2),Math.round(cy-s*0.40),s,s);}
  ctx.restore();
}
function drawTitle(SW,SH){
  // Fondo: el mismo túnel de tuberías del juego, para que el título se sienta parte del mundo
  const savedX=cam.x, savedY=cam.y;

  drawParallax(SW,SH);
  cam.x=savedX; cam.y=savedY;
  ctx.fillStyle='rgba(8,12,20,0.55)';ctx.fillRect(0,0,SW,SH);

  const small=SW<200;
  // Layout explícito por perfil: el logotipo domina la pantalla, como en el arte de referencia
  const L=small
    ? {tSize:24,tY:2, sSize:7, sY:24, shY:52, shW:44,shH:36, mY:78, mStep:11}
    : {tSize:36,tY:2, sSize:9, sY:33, shY:66, shW:56,shH:46, mY:96, mStep:12};

  // Título en dorado con sombra dura y realce anaranjado, como el logotipo promocional
  ctx.font='bold '+L.tSize+'px monospace';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle=C_('K');ctx.fillText('PERSEO',SW/2+2,L.tY+2);

  ctx.fillStyle=C_('Y');ctx.fillText('PERSEO',SW/2,L.tY);
  ctx.font='bold '+L.sSize+'px monospace';
  ctx.fillStyle=C_('K');ctx.fillText('SOMBRAS DE SILENCIO',SW/2+1,L.sY+1);

  ctx.textAlign='left';

  drawShield(SW/2,L.shY,L.shW,L.shH);

  // Menú: JUGAR / SONIDO / DIFICULTAD
  const items=[

      text((frame>>4)%2?'▶ '+t+' ◀':t,SW/2,y,'Y',8,true);
    }else text(t,SW/2,y,'W',8,true);
  });
  text('↑↓ elegir · ←→ cambiar · Enter/Z confirmar',SW/2,SH-19,'G',6,true);
  text('X ganchito · V traza · C dash · I inventario',SW/2,SH-11,'T',6,true);
}
function drawDead(SW,SH){
  drawWorld();
  ctx.fillStyle='rgba(70,8,16,'+Math.min(0.75,stateT/30)+')';ctx.fillRect(0,0,SW,SH);
  if(stateT>18){
    text('ESTÁS MUERTO',SW/2,SH/2-30,'W',13,true);
    const opts=['Reintentar desde el último punto guardado','Volver al inicio'];
    opts.forEach((o,i)=>{
      const y=SH/2-4+i*14, sel=i===deathSel;
      text((sel?'▶ ':'   ')+o,SW/2,y,sel?'Y':'G',7,true);
    });
    if(stateT>30&&(frame>>4)%2)text('↑↓ elegir · Z/Enter confirmar',SW/2,SH/2+30,'W',6,true);

function drawStoryIntroBG(SW,SH){
  ctx.fillStyle=C_('K');ctx.fillRect(0,0,SW,SH);
  // Estrellas titilantes
  for(let i=0;i<20;i++){
    const sx=(i*53+41)%SW, sy=(i*31)%54+6;
    if((frame+i*9)%50<32){ctx.fillStyle=C_('G');ctx.fillRect(sx,sy,1,1);}
  }
  // Luna
  ctx.fillStyle=C_('L');
  ctx.beginPath();ctx.arc(SW-30,24,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C_('K');
  ctx.beginPath();ctx.arc(SW-25,21,8,0,Math.PI*2);ctx.fill();
  // Silueta urbana con scroll lento (paneo continuo, como una toma aérea de la ciudad)
  const off=Math.floor(frame*0.18)%26;
  for(let i=-1;i<SW/26+2;i++){
    const wx=i*26-off, h=20+(((i+1000)*31)%26);
    ctx.fillStyle=C_('s');ctx.fillRect(wx,SH-h,16,h);
    if(((i+Math.floor(frame/25))%3)===0){ctx.fillStyle=C_('Y');ctx.fillRect(wx+4,SH-h+7,2,2);}
    if(((i+Math.floor(frame/25)+1)%4)===0){ctx.fillStyle=C_('Y');ctx.fillRect(wx+10,SH-h+13,2,2);}
  }
  // Niebla baja a la deriva
  const foff=Math.floor(frame*0.35)%(SW*2);
  ctx.globalAlpha=0.30;ctx.fillStyle=C_('T');
  ctx.fillRect(-SW*2+foff,SH-13,SW*2,13);
  ctx.fillRect(foff-SW*0.4,SH-9,SW*2,9);
  ctx.globalAlpha=1;
}
function drawStory(SW,SH){
  // Ahora exclusiva de las intros de nivel (texto plano sobre el propio escenario);
  // la intro general del juego usa drawIntroCine, con viñetas ilustradas.
  const SWl=SW,SHl=SH;
  drawWorld();
  ctx.fillStyle='rgba(4,6,10,0.86)';ctx.fillRect(0,0,SWl,SHl);
  const title=LV.name.toUpperCase();
  text(title,SWl/2,14,'R',13,true);
  const page=storyPages[storyIdx]||'';
  const lines=wrapText(page,SWl-36,7);
  const startY=SHl/2-(lines.length*10)/2;
  lines.forEach((l,i)=>text(l,SWl/2,startY+i*10,'W',7,true));
  text((storyIdx+1)+' / '+storyPages.length,SWl/2,SHl-26,'G',6,true);
  if((frame>>4)%2)text(storyIdx<storyPages.length-1?'Z/ENTER: continuar':'Z/ENTER: ¡adelante!',SWl/2,SHl-14,'Y',7,true);
  text('ESC: saltar',SWl/2,SHl-6,'G',6,true);
}
/* ---------- Cinemática de introducción (rapto de Aurorita) ----------
   Mismo espíritu que la cinemática final: viñetas ilustradas con primitivas de canvas +
   sprites existentes, énfasis en quien habla, y un marco tipo viñeta de cómic para reforzar
   el tono cinematográfico en vez de un simple bloque de texto informativo. */
function drawComicFrame(SW,SH){
  ctx.fillStyle=C_('K');
  ctx.fillRect(0,0,SW,3);ctx.fillRect(0,SH-3,SW,3);
  ctx.fillRect(0,0,3,SH);ctx.fillRect(SW-3,0,3,SH);
}
function drawIntroScene(scene,SW,SH){
  const floorY=SH-30;
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=C_('S');ctx.fillRect(0,floorY,SW,SH-floorY);
  const aImg=cache[mode]['aurora_idle'], tImg=cache[mode]['thug1'], tImg2=cache[mode]['thug2'],
        pImg=cache[mode]['p_idle1'];
  const page=INTRO_STORY[storyIdx]||{};
  if(scene==='street_calm'){
    // Aurorita camina sola y tranquila; un par de siluetas apenas insinuadas la acechan.
    const t=Math.min(1,introT/150);
    const aw=aImg.width*3,ah=aImg.height*3;
    const ax=20+t*(SW-90), bob=Math.sin(introT/8)*2;
    ctx.globalAlpha=0.3;
    ctx.drawImage(tImg,SW-58,floorY-tImg.height*2.4,tImg.width*2.4,tImg.height*2.4);
    ctx.globalAlpha=1;
    ctx.drawImage(aImg,ax,floorY-ah+bob,aw,ah);
  }else if(scene==='ambush'||scene==='scared'){
    // Dos matones cierran el paso a Aurorita, uno a cada lado; en 'scared' uno la sujeta.
    if(scene==='scared'&&introT<3){shake=6;}
    const speaking=(page.who==='AURORITA');
    const aSc=speaking?3.4:2.6, aA=speaking?1:0.6;
    const aw=aImg.width*aSc,ah=aImg.height*aSc;
    const jitter=scene==='scared'?(Math.random()-0.5)*2:0;
    ctx.globalAlpha=aA;
    ctx.drawImage(aImg,SW/2-aw/2+jitter,floorY-ah,aw,ah);
    ctx.globalAlpha=1;
    const tSc=speaking?2.2:2.8, tA=speaking?0.6:1;
    const tw=tImg.width*tSc,th=tImg.height*tSc;
    ctx.globalAlpha=tA;
    ctx.save();ctx.translate(SW/2-aw/2-tw+6,floorY-th);ctx.scale(-1,1);
    ctx.drawImage(tImg,-tw,0,tw,th);ctx.restore();
    ctx.drawImage(tImg2,SW/2+aw/2-6,floorY-th,tw,th);
    ctx.globalAlpha=1;
  }else if(scene==='caged'||scene==='defiant'){
    // Aurorita tras los barrotes; el matón se queda mirando con burla.
    const cx=SW/2-24,cw=48,ch=54,cy=floorY-ch;
    ctx.fillStyle=C_('D');ctx.fillRect(cx,cy,cw,ch);
    ctx.fillStyle=C_('K');
    for(let i=0;i<=5;i++)ctx.fillRect(cx+4+i*8,cy+4,3,ch-8);
    const speaking=(page.who==='AURORITA');
    const aSc=speaking?3.2:2.6, aA=speaking?1:0.7;
    const aw=aImg.width*aSc,ah=aImg.height*aSc;
    ctx.globalAlpha=aA;
    ctx.drawImage(aImg,cx+6,floorY-ah,aw,ah);
    ctx.globalAlpha=1;
    const tSc=speaking?2:2.6, tA=speaking?0.55:1;
    const tw=tImg.width*tSc,th=tImg.height*tSc;
    ctx.globalAlpha=tA;
    ctx.drawImage(tImg,cx+cw+8,floorY-th,tw,th);
    ctx.globalAlpha=1;
    if(scene==='defiant'&&(frame>>3)%2===0){ctx.fillStyle=C_('Y');ctx.fillRect(Math.round(cx+cw/2),Math.round(cy-4),2,2);}
  }else if(scene==='sewer_drag'){
    // Plano abierto: arrastran la jaula hacia una alcantarilla que humea en el suelo.
    const hx=SW/2+30,hy=floorY+2;
    ctx.fillStyle=C_('K');ctx.beginPath();ctx.ellipse(hx,hy,20,6,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.4+Math.sin(introT/10)*0.15;ctx.fillStyle=C_('G');
    ctx.fillRect(hx-14,hy-16,28,16);ctx.globalAlpha=1;
    const t=Math.min(1,introT/160);
    const cx=40+t*(hx-70),cw=30,ch=32,cy=floorY-ch;
    ctx.fillStyle=C_('D');ctx.fillRect(cx,cy,cw,ch);
    ctx.fillStyle=C_('K');
    for(let i=0;i<=3;i++)ctx.fillRect(cx+3+i*7,cy+3,2,ch-6);
    ctx.globalAlpha=0.85;
    ctx.drawImage(aImg,cx+6,floorY-aImg.height*2,aImg.width*2,aImg.height*2);
    ctx.globalAlpha=1;
    const tw=tImg.width*2.2,th=tImg.height*2.2;
    ctx.drawImage(tImg,cx-tw+6,floorY-th,tw,th);
  }else if(scene==='vow'){
    // Perseo solo, de noche, donde antes estaba su hermana. El juramento silencioso.
    const pw=pImg.width*3,ph=pImg.height*3;
    ctx.globalAlpha=0.9;
    ctx.drawImage(pImg,SW/2-pw/2,floorY-ph,pw,ph);
    ctx.globalAlpha=1;
  }
  for(const p of particles){ctx.fillStyle=C_(p.col);ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
}

function drawBossDialog(SW,SH){
  const line=bossDialog.lines[bossDialog.idx];
  const fromPerseo=line.who==='PERSEO';

  // Panel de cómic: fondo dramático temático (colores del bioma actual) en vez del
  // escenario de juego normal. Perseo y el jefe quedan AMBOS a la vista, en primer
  // plano, uno a cada lado — pero quien habla en ese momento se dibuja grande, nítido
  // y con un ligero vaivén; el que calla queda atrás, más pequeño y a media sombra.
  const thk=LV&&LV.theme?LV.theme.brickD:'S';
  ctx.fillStyle=C_('K');ctx.fillRect(0,0,SW,SH);
  ctx.fillStyle=C_(thk);ctx.globalAlpha=0.55;
  for(let i=0;i<7;i++)ctx.fillRect(0,Math.round(i*SH/7),SW,Math.round(SH/7)-2);
  ctx.globalAlpha=1;
  ctx.fillStyle=C_('K');ctx.globalAlpha=0.4;ctx.fillRect(0,0,SW,SH*0.4);ctx.globalAlpha=1;

  const bCfg=(bossRef&&(BOSS_CONFIG[bossRef.key]||BOSS_CONFIG.capataz))||BOSS_CONFIG.capataz;
  const pImg=cache[mode]['p_idle1'], bImg=cache[mode][bCfg.sprite];
  const floorY=SH-30;
  ctx.imageSmoothingEnabled=false;

  // Perseo — lado izquierdo
  {
    const active=fromPerseo, sc=active?4:2.4, a=active?1:0.4;
    const w=pImg.width*sc, h=pImg.height*sc;
    const bob=active?Math.sin(frame/9)*2:0;
    ctx.globalAlpha=a;
    ctx.drawImage(pImg,16,floorY-h+bob,w,h);
    ctx.globalAlpha=1;
  }
  // El Capataz — lado derecho
  {
    const active=!fromPerseo, sc=active?2.6:1.6, a=active?1:0.4;
    const w=bImg.width*sc, h=bImg.height*sc;
    const bob=active?Math.sin(frame/9)*2:0;
    ctx.save();ctx.globalAlpha=a;
    ctx.translate(SW-16-w,floorY-h+bob);ctx.scale(-1,1);
    ctx.drawImage(bImg,-w,0,w,h);
    ctx.restore();
  }

  // Globo de cómic con la línea actual, siempre en primer plano sobre ambos retratos
  const boxW=SW-24, boxH=48, bx=12, by=SH-boxH-10;
  const tailX=fromPerseo?bx+18:bx+boxW-34;
  ctx.beginPath();
  ctx.moveTo(tailX,by);ctx.lineTo(tailX+12,by);ctx.lineTo(tailX+3,by-11);ctx.closePath();
  ctx.fillStyle=C_('W');ctx.fill();
  ctx.fillStyle=C_('W');ctx.fillRect(bx,by,boxW,boxH);
  ctx.fillStyle=C_('K');
  ctx.fillRect(bx,by,boxW,2);ctx.fillRect(bx,by+boxH-2,boxW,2);
  ctx.fillRect(bx,by,2,boxH);ctx.fillRect(bx+boxW-2,by,2,boxH);
  text(line.who,bx+8,by+6,fromPerseo?'B':'R',7);
  const lines=wrapText(line.text,boxW-16,7);
  lines.forEach((l,i)=>text(l,bx+8,by+17+i*9,'K',7));
  if((frame>>4)%2)text('▼',bx+boxW-14,by+boxH-11,'D',7);
  text((bossDialog.idx+1)+'/'+bossDialog.lines.length+'  ·  Z/Enter continuar  ·  ESC saltar',SW/2,SH-8,'G',6,true);
}

/* ---------- Cinemática final y créditos ----------
   Tras derrotar a Betty, en vez de la vieja pantalla de "victoria" (pensada para el corte
   de la vertical slice de 2 niveles), se reproduce una escena por viñetas del reencuentro
   con Aurorita, y al terminar se encadena con los créditos reales del juego completo. */
function drawEndingBG(SW,SH){
  ctx.fillStyle=C_('K');ctx.fillRect(0,0,SW,SH);
  ctx.fillStyle=C_('h');ctx.globalAlpha=0.5;
  for(let i=0;i<6;i++)ctx.fillRect(0,Math.round(i*SH/6),SW,Math.round(SH/6)-2);
  ctx.globalAlpha=1;
}
function drawEndingScene(scene,SW,SH){
  const floorY=SH-30;
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=C_('S');ctx.fillRect(0,floorY,SW,SH-floorY);
  const pImg=cache[mode]['p_idle1'], aImg=cache[mode]['aurora_idle'], bImg=cache[mode]['boss_betty'];
  if(scene==='betty_fall'){
    // Betty caída al fondo, entre escombros; Perseo de pie en primer plano.
    const bw=bImg.width*2.2, bh=bImg.height*2.2;
    ctx.save();ctx.globalAlpha=0.55;
    ctx.translate(SW/2+10,floorY-bh*0.55);ctx.rotate(0.5);
    ctx.drawImage(bImg,-bw/2,-bh/2,bw,bh);
    ctx.restore();
    if(frame%5===0)burst(SW/2+10,floorY-6,'G',3,2);
    const pw=pImg.width*3.2,ph=pImg.height*3.2;
    ctx.drawImage(pImg,18,floorY-ph,pw,ph);
  }else if(scene==='approach'){
    // Jaula al fondo a la derecha; Perseo caminando hacia ella desde la izquierda.
    const cx=SW-64,cw=44,ch=54,cy=floorY-ch;
    ctx.fillStyle=C_('D');ctx.fillRect(cx,cy,cw,ch);
    ctx.fillStyle=C_('K');
    for(let i=0;i<=5;i++)ctx.fillRect(cx+4+i*7,cy+4,3,ch-8);
    const walk=(frame>>3)%2===0?'p_walk1':'p_walk3';
    const wImg=cache[mode][walk];
    const px=24+((frame*0.5)%(SW-140));
    const pw=wImg.width*3,ph=wImg.height*3;
    ctx.drawImage(wImg,px,floorY-ph,pw,ph);
  }else if(scene==='open'){
    // Candado roto, barrotes abiertos, Aurorita asomándose desde dentro.
    const cx=SW/2+20,cw=48,ch=56,cy=floorY-ch;
    ctx.fillStyle=C_('D');ctx.fillRect(cx,cy,cw,ch);
    for(let i=0;i<=5;i++){
      const gap=i===2||i===3;
      ctx.fillStyle=gap?C_('D'):C_('K');
      const bend=gap?-6-Math.sin(frame/10)*2:0;
      ctx.fillRect(cx+4+i*8+bend,cy+4,3,ch-8);
    }
    if(frame%6===0)burst(cx+cw/2,cy+ch-10,'Y',2,1.5);
    const aw=aImg.width*3,ah=aImg.height*3;
    ctx.drawImage(aImg,cx+6,floorY-ah,aw,ah);
    // Perseo golpeando el candado con su Ganchito mortal (el mismo ataque de combate,
    // no una pose idle), con el rastro de luz parpadeando como en el impacto real.
    const atkImg=cache[mode]['p_atk'], slashImg=cache[mode]['slash'];
    const pw=atkImg.width*3,ph=atkImg.height*3, px=cx-46;
    ctx.drawImage(atkImg,px,floorY-ph,pw,ph);
    if((frame>>2)%2===0){
      const sw=slashImg.width*2.4,sh=slashImg.height*2.4;
      ctx.globalAlpha=0.9;
      ctx.drawImage(slashImg,px+pw-10,floorY-ph+ph*0.35,sw,sh);
      ctx.globalAlpha=1;
    }
  }else if(scene==='reunion'){
    // Ambos en primer plano, uno junto al otro; quien habla se destaca (como en el
    // diálogo cómic de los jefes), el otro queda algo atrás y en penumbra.
    const speaker=(ENDING_STORY[endIdx]||{}).who;
    {
      const active=speaker==='PERSEO', sc=active?3.6:2.8, a=active?1:0.55;
      const w=pImg.width*sc,h=pImg.height*sc,bob=active?Math.sin(frame/9)*2:0;
      ctx.globalAlpha=a;ctx.drawImage(pImg,20,floorY-h+bob,w,h);ctx.globalAlpha=1;
    }
    {
      const active=speaker==='AURORITA', sc=active?3.6:2.8, a=active?1:0.55;
      const w=aImg.width*sc,h=aImg.height*sc,bob=active?Math.sin(frame/9)*2:0;
      ctx.save();ctx.globalAlpha=a;
      ctx.translate(SW-20-w,floorY-h+bob);ctx.scale(-1,1);
      ctx.drawImage(aImg,-w,0,w,h);
      ctx.restore();
    }
  }else if(scene==='epilogue'){
    // Silueta de ambos alejándose hacia un resplandor: la salida a la superficie.
    ctx.fillStyle=C_('Y');ctx.globalAlpha=0.5;
    ctx.beginPath();ctx.arc(SW/2,floorY-40,34,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    const t=Math.min(1,endT/140);
    const px=30+t*(SW/2-50), pw=pImg.width*2,ph=pImg.height*2;
    ctx.globalAlpha=0.85;
    ctx.drawImage(pImg,px,floorY-ph,pw,ph);
    ctx.drawImage(aImg,px+16,floorY-ph*0.82,aImg.width*1.6,aImg.height*1.6);
    ctx.globalAlpha=1;
  }
  for(const p of particles){ctx.fillStyle=C_(p.col);ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
}
function drawEnding(SW,SH){
  drawEndingBG(SW,SH);
  const page=ENDING_STORY[endIdx]||ENDING_STORY[ENDING_STORY.length-1];
  drawEndingScene(page.scene,SW,SH);
  ctx.fillStyle='rgba(4,6,10,0.72)';ctx.fillRect(0,SH-56,SW,56);
  if(page.who)text(page.who,16,SH-50,page.who==='PERSEO'?'B':'P',7);
  const lines=wrapText(page.text,SW-28,7);
  lines.forEach((l,i)=>text(l,SW/2,SH-40+i*9,'W',7,true));
  text((endIdx+1)+' / '+ENDING_STORY.length,SW/2,SH-8+ (lines.length<=2?0:0),'G',6,true);
  if((frame>>4)%2)text('Z/ENTER: continuar',SW-4,6,'Y',6);
  text('ESC: saltar a créditos',4,6,'G',6);
}
function drawCredits(SW,SH){
  ctx.fillStyle=C_('K');ctx.fillRect(0,0,SW,SH);
  // Estrellas de fondo titilantes, igual que en la intro, para cerrar el círculo visual.
  for(let i=0;i<16;i++){
    const sx=(i*47+23)%SW, sy=(i*67)%SH;
    if((frame+i*7)%40<24){ctx.fillStyle=C_('G');ctx.fillRect(sx,sy,1,1);}
  }
  const lineH=10, startY=SH-credT*0.5;
  let y=startY;
  for(const block of CREDITS){
    if(block.title){text(block.title,SW/2,y,'Y',block.title==='FIN'?12:10,true);y+=lineH*2;}
    for(const l of block.lines){text(l,SW/2,y,'W',7,true);y+=lineH;}
    y+=lineH*1.6;
  }
  const totalH=(y-startY)+SH;
  if(credT*0.5>totalH)credT=0; // reinicia el scroll en bucle suave
  text('ENTER: volver al título',SW/2,SH-8,'G',6,true);
}

/* ---------- Bucle principal ---------- */
function updateCam(){
  const SW=cv.width,SH=cv.height;
  cam.x=Math.max(0,Math.min(P.x+5-SW/2,LV.w*8-SW));
  cam.y=Math.max(0,Math.min(P.y+6-SH/2,LV.h*8-SH));
}
function step(){
  frame++;
  if(shake>0){shake*=0.85;if(shake<0.5)shake=0;}
  if(state==='play'&&!paused&&!invOpen){
    stats.time++;
    signText=null;
    updatePlayer();
    updateEnts();
    if(zoneT>0)zoneT--;
    updateCam();
  }else if(state==='banner'){
    banner.t--;
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.t--;}
    particles=particles.filter(p=>p.t>0);
    if(banner.t<=0){banner=null;state='play';}
  }else if(state==='dead'){
    stateT++;
  }else if(state==='trans'){
    updateTransition();
    if(state==='trans'&&trans&&trans.phase==='in')updateCam();
  }else if(state==='victory'){
    stateT++;
  }else if(state==='ending'){
    stateT++;endT++;
    if(frame%16===0)particles.push({x:Math.random()*(cv.width||240),y:(cv.height||160)+2,
      vx:(Math.random()-0.5)*0.2,vy:-0.3-Math.random()*0.3,t:200,col:(frame%20<10)?'C':'G'});
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.t--;}
    particles=particles.filter(p=>p.t>0);
  }else if(state==='credits'){
    credT++;
  }else if(state==='storyintro'){
    introT++;
    // Motas ambientales flotando lentamente sobre el horizonte de la ciudad
    if(frame%14===0)particles.push({x:Math.random()*(cv.width||240),y:(cv.height||160)+2,
      vx:(Math.random()-0.5)*0.25,vy:-0.35-Math.random()*0.35,t:220,col:(frame%28<14)?'C':'G'});
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.t--;}
    particles=particles.filter(p=>p.t>0);
  }else if(state==='levelstory'){
    // Paneo cinematográfico lento por el nivel (a modo de "vistazo previo") mientras se lee
    // el texto, y motas de polvo/óxido a la deriva propias del bioma para dar sensación de
    // vida detrás de la introducción.
    storyPanT++;
    if(LV){
      cam.x=Math.max(0,Math.min(LV.w*8-cv.width, storyPanT*0.55));
      cam.y=Math.max(0,Math.min(LV.h*8-cv.height, LV.spawn[1]*8+6-cv.height/2));
      if(frame%11===0){
        const col=lvIndex===0?'C':'O';
        particles.push({x:cam.x+Math.random()*cv.width,y:cam.y-4,
          vx:(Math.random()-0.5)*0.15,vy:0.35+Math.random()*0.3,t:210,col});
      }
    }
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.t--;}
    particles=particles.filter(p=>p.t>0);
  }
}
function render(){
  const SW=cv.width,SH=cv.height;
  if(state==='title'){drawTitle(SW,SH);return;}
  if(state==='storyintro'){drawIntroCine(SW,SH);return;}
  if(state==='levelstory'){drawStory(SW,SH);return;}
  if(state==='victory'){drawVictory(SW,SH);return;}
  if(state==='ending'){drawEnding(SW,SH);return;}
  if(state==='credits'){drawCredits(SW,SH);return;}
  if(state==='dead'){drawDead(SW,SH);return;}
  if(state==='banner'){drawBanner(SW,SH);return;}
  if(state==='bossdialog'){drawBossDialog(SW,SH);return;}
  if(state==='trans'&&trans){
    if(trans.phase==='out'){
      ctx.drawImage(snapC,0,0);
      pixelate(1+trans.t*0.55);
    }else{
      drawWorld();
      pixelate(1+(26-trans.t)*0.55);
    }
    return;
  }
  drawWorld();
  if(invOpen){
    drawInventory(SW,SH);
  }else if(paused){
    ctx.fillStyle='rgba(8,10,18,0.6)';ctx.fillRect(0,0,SW,SH);
    text('PAUSA',SW/2,SH/2-6,'W',12,true);
  }
}
function loop(){step();render();requestAnimationFrame(loop);}

/* ---------- Modo GBC/GBA ---------- */
const bGBA=document.getElementById('bGBA'),bGBC=document.getElementById('bGBC'),bMute=document.getElementById('bMute');
function setMode(m){
  mode=m;cv.width=MODES[m].w;cv.height=MODES[m].h;
  ctx.imageSmoothingEnabled=false;
  bGBA.classList.toggle('on',m==='gba');bGBC.classList.toggle('on',m==='gbc');
  if(LV)updateCam();
  fit();
}
function fit(){
  const s=Math.max(1,Math.floor(Math.min((innerWidth-40)/cv.width,(innerHeight-90)/cv.height)));
  cv.style.width=cv.width*s+'px';cv.style.height=cv.height*s+'px';
}
bGBA.onclick=()=>{audioInit();setMode('gba');};
bGBC.onclick=()=>{audioInit();setMode('gbc');};
bMute.onclick=()=>{audioInit();muted=!muted;bMute.textContent='♪ Sonido: '+(muted?'OFF':'ON');};
addEventListener('resize',fit);

/* ---------- Entrada ---------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
  audioInit();
  if(k==='g'){setMode(mode==='gba'?'gbc':'gba');return;}
  if(k==='m'){muted=!muted;bMute.textContent='♪ Sonido: '+(muted?'OFF':'ON');return;}

  // Pantalla de título: menú JUGAR / SONIDO / DIFICULTAD
  if(state==='title'){
    if(k==='arrowup'||k==='w'){titleSel=(titleSel+2)%3;SFX.check();return;}
    if(k==='arrowdown'||k==='s'){titleSel=(titleSel+1)%3;SFX.check();return;}
    if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d'){
      if(titleSel===1){muted=!muted;bMute.textContent='♪ Sonido: '+(muted?'OFF':'ON');SFX.check();}
      else if(titleSel===2){
        const dir=(k==='arrowleft'||k==='a')?-1:1, idx=DIFFICULTIES.indexOf(difficulty);
        difficulty=DIFFICULTIES[(idx+dir+DIFFICULTIES.length)%DIFFICULTIES.length];
        SFX.check();
      }
      return;
    }
    if(k==='enter'||k==='z'||k===' '||k==='x'){
      if(titleSel===0){state='storyintro';storyPages=INTRO_STORY;storyIdx=0;introT=0;particles=[];}
      else if(titleSel===1){muted=!muted;bMute.textContent='♪ Sonido: '+(muted?'OFF':'ON');SFX.check();}
      else if(titleSel===2){
        const idx=DIFFICULTIES.indexOf(difficulty);
        difficulty=DIFFICULTIES[(idx+1)%DIFFICULTIES.length];
        SFX.check();
      }
      return;
    }
    return;
  }
  // Diálogo cómic del jefe: avanzar viñetas o saltar directo a la pelea
  if(state==='bossdialog'){
    if(k==='escape'){startBossIntro();return;}
    if(k==='enter'||k==='z'||k===' '||k==='x'){
      bossDialog.idx++;
      if(bossDialog.idx>=bossDialog.lines.length)startBossIntro();
      return;
    }
    return;
  }
  // Pantalla de muerte: reintentar desde checkpoint o volver al inicio
  if(state==='dead'){
    if(stateT<18)return;
    if(k==='arrowup'||k==='arrowdown'||k==='w'||k==='s'){deathSel=1-deathSel;SFX.check();return;}
    if(k==='enter'||k==='z'||k===' '||k==='x'){
      if(deathSel===0)respawn(); else {state='title';playSong('title');}
      return;
    }
    return;
  }
  // Cinemática final: avanzar viñetas o saltar directo a los créditos
  if(state==='ending'){
    if(k==='escape'){state='credits';credT=0;return;}
    if(k==='enter'||k==='z'||k===' '||k==='x'){
      endIdx++;endT=0;
      if(endIdx>=ENDING_STORY.length){state='credits';credT=0;}
      return;
    }
    return;
  }
  // Créditos finales: Enter (o Esc) vuelve al título
  if(state==='credits'){
    if(k==='enter'||k==='escape'){state='title';playSong('title');}
    return;
  }
  // Historia (introducción general o de nivel): avanzar páginas o saltar directo
  if(state==='storyintro'||state==='levelstory'){
    if(k==='escape'){
      if(state==='storyintro')newGame(); else state='play';
      return;
    }
    if(k==='enter'||k==='z'||k===' '||k==='x'){
      storyIdx++;introT=0;
      if(storyIdx>=storyPages.length){
        if(state==='storyintro')newGame(); else state='play';
      }
      return;
    }
    return;
  }
  // Inventario: abrir/cerrar y navegar
  if(state==='play'&&k==='i'&&!paused){invOpen=!invOpen;invTab=0;invSel=0;SFX.check();return;}
  if(invOpen){
    if(k==='escape'){invOpen=false;return;}
    if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d'){invTab=1-invTab;invSel=0;SFX.check();return;}
    if(k==='arrowup'||k==='w'){const n=invTab===0?ABILITIES.length:RELICS.length;invSel=(invSel-1+n)%n;return;}
    if(k==='arrowdown'||k==='s'){const n=invTab===0?ABILITIES.length:RELICS.length;invSel=(invSel+1)%n;return;}
    if((k==='z'||k===' '||k==='x'||k==='enter')&&invTab===1){
      const r=RELICS[invSel];
      if(P.relicsFound[r.id]){
        if(P.relicsEq[r.id]){P.relicsEq[r.id]=false;SFX.check();}
        else if(equippedCount()<2){P.relicsEq[r.id]=true;SFX.ability();}
        else SFX.deny();
      }
      return;
    }
    return;
  }
  if(k==='enter'){
    if(state==='victory'&&stateT>90){state='title';playSong('title');}
    else if(state==='banner'){banner=null;state='play';}
    else if(state==='play')paused=!paused;
    return;
  }
  if(state==='banner'&&(k==='z'||k===' '||k==='x')){banner=null;state='play';return;}
  keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* ---------- Arranque ---------- */
buildCache();
setMode('gba');
playSong('title');
loop();
</script>
